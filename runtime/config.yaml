# Runtime configuration for the Shell Company Screening Agent

agent:
  name: "Shell Company Screening Agent"

providers:

  openai:
    enabled: true
    model: "o3-deep-research"
    poll_interval_seconds: 10

  gemini:
    enabled: true
    agent: "deep-research-preview-04-2026"
    poll_interval_seconds: 10

  perplexity:
    enabled: true
    preset: "deep-research"

output:
  format: "markdown"
  directory: "output"
  save_report: true
